// Verify the actual reobfuscated artifact, not a development classes directory.
tasks.register('verifyOreRelease') {
    dependsOn tasks.named('reobfJar')
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            ['META-INF/mods.toml', 'pack.mcmeta', 'geg.mixins.json', 'ore.mixins.json',
             'io/github/luyingyilong/ore/OreClient.class', 'assets/ore/themes/ore.json',
             'io/github/luyingyilong/ore/form/FieldKey.class',
             'io/github/luyingyilong/ore/form/FormField.class',
             'io/github/luyingyilong/ore/form/FormValues.class',
             'io/github/luyingyilong/ore/form/FormValidation.class',
             'io/github/luyingyilong/ore/theme/Theme.class',
             'io/github/luyingyilong/ore/theme/ThemeDB.class',
             'io/github/luyingyilong/ore/theme/StyleBox.class',
             'io/github/luyingyilong/ore/TextureRect.class',
             'io/github/luyingyilong/ore/Slider.class',
             'io/github/luyingyilong/ore/Slider$RangeValue.class',
             'assets/ore/textures/gui/slider.png', 'assets/ore/textures/gui/slider_disabled.png',
             'assets/ore/textures/gui/grabber_area.png', 'assets/ore/textures/icons/grabber_normal.png',
             'assets/ore/textures/icons/tick.png',
             'io/github/luyingyilong/ore/render/TextureRegion.class',
             'io/github/luyingyilong/ore/render/TextureSource.class',
             'io/github/luyingyilong/ore/render/TexturePainter.class',
             'assets/ore/textures/gui/panel.png',
             'io/github/luyingyilong/ore/theme/IconTheme.class',
             'assets/geg/themes/ui.json', 'assets/geg/textures/icons/email.png',
             'io/github/luyingyilong/ore/render/Canvas.class',
             'io/github/luyingyilong/ore/render/DrawContext.class',
             'io/github/luyingyilong/ore/window/ScreenWindowHost.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/jei/OreJeiCanvasWidget.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/emi/OreEmiCanvasWidget.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/rei/OreReiCanvasWidget.class',
             'assets/ore/font/ore.json', 'io/github/luyingyilong/ore/OreClientExtension.class',
             'io/github/luyingyilong/ore/signal/Signal.class', 'io/github/luyingyilong/ore/signal/Signal0.class',
             'io/github/luyingyilong/ore/signal/SignalScope.class', 'io/github/luyingyilong/ore/signal/Connection.class',
             'io/github/luyingyilong/ore/signal/SignalDiagnostics.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/RecipeViewerExclusions.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/RecipeViewerInputGuard.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/InputGestureOwners.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/jei/OreJeiPlugin.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/emi/OreEmiPlugin.class',
             'io/github/luyingyilong/ore/compat/recipeviewer/rei/OreReiPlugin.class',
             'io/github/luyingyilong/ore/text/TextLayout.class',
             'io/github/luyingyilong/ore/text/FontRepository.class',
             'io/github/luyingyilong/ore/text/TextRenderer.class',
             'assets/ore/shaders/core/text.fsh', 'assets/ore/text/emoji.zip',
             'META-INF/licenses/noto-emoji/LICENSE', 'META-INF/licenses/noto-emoji/Apache-2.0.txt'].each {
                if (!names.contains(it)) throw new GradleException("Missing release entry: $it")
            }
            def forbidden = names.findAll { it.startsWith('io/github/luyingyilong/ore/inspector/') ||
                it.startsWith('io/github/luyingyilong/ore/compat/recipeviewer/canvas/') ||
                it.startsWith('io/github/luyingyilong/geg/client/ui/') ||
                it == 'assets/ore/themes.json' || it.startsWith('assets/ore/textures/modularui/') ||
                it == 'io/github/luyingyilong/ore/Button$Icon.class' ||
                it == 'io/github/luyingyilong/ore/theme/ThemeIcon.class' ||
                it == 'io/github/luyingyilong/ore/theme/OreIcons.class' ||
                it == 'io/github/luyingyilong/ore/theme/OreTrueTypeGlyphProvider.class' ||
                it == 'io/github/luyingyilong/ore/mixin/TrueTypeGlyphProviderDefinitionMixin.class' ||
                it.startsWith('text-fonts/') || it.startsWith('icyllis/modernui/') ||
                it ==~ /assets\/ore\/textures\/gui\/silder[^\/]*\.(png|aseprite)/ ||
                it ==~ /assets\/ore\/textures\/icons\/switch_button_[^\/]*\.(png|aseprite)/ ||
                it ==~ /assets\/ore\/textures\/icons\/(email|email_readed|gift|gift_opened|flag|org)\.(png|aseprite)/ ||
                it.startsWith('assets/ore_inspector/') || it.startsWith('assets/ore_gallery/') ||
                it.startsWith('io/github/luyingyilong/ore/gallery/') ||
                it.startsWith('io/github/luyingyilong/ore/development/') || it.contains('InspectorBootstrap') ||
                it.startsWith('assets/geg/font/') || it == 'assets/geg/themes.json' ||
                it == 'assets/geg/sounds.json' || it == 'io/github/luyingyilong/geg/sound/GegSounds.class' ||
                it == 'META-INF/services/io.github.luyingyilong.ore.OreClientExtension' ||
                it.endsWith('Test.class') || it.startsWith('net/minecraftforge/fml/relauncher/') ||
                it.startsWith('brachy/modularui/') || it.startsWith('mezz/jei/') ||
                it.startsWith('dev/emi/') || it.startsWith('me/shedaniel/') ||
                it.startsWith('net/fabricmc/') || it.startsWith('dev/architectury/') }
            if (!forbidden.empty) throw new GradleException("Development/dependency entries in release: $forbidden")
            def metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if ((metadata =~ /(?m)^modId\s*=/).count != 1) throw new GradleException('Release must have one Mod identity')
            def manifest = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            if (manifest.mainAttributes.getValue('MixinConfigs') != 'geg.mixins.json,ore.mixins.json')
                throw new GradleException('Both client mixin configurations must be included')
            logger.lifecycle("Ore release boundary verified: ${jar.name}")
        }
    }
}

// Can run without compiling GEG: both source sets must stay independent of the host.
tasks.register('verifyOreModules') {
    dependsOn ':ore-lib:classes', ':ore-lib:inspectorClasses'
    doLast {
        [project(':ore-lib')].each { library ->
            library.fileTree('src').matching { include '**/*.java', '**/*.json', '**/*.properties' }.each { source ->
                def text = source.getText('UTF-8')
                if (text.contains('io.github.luyingyilong.geg') || (text =~ /(?i)\bgeg:/).find())
                    throw new GradleException("GEG dependency in $source")
            }
            [library.sourceSets.main, library.sourceSets.inspector].collectMany { it.output.classesDirs.files.toList() }.each { classes ->
                library.fileTree(classes).matching { include '**/*.class' }.each { compiled ->
                    if (new String(compiled.bytes, java.nio.charset.StandardCharsets.ISO_8859_1).contains('io/github/luyingyilong/geg'))
                        throw new GradleException("GEG bytecode dependency in $compiled")
                }
            }
            if (library.file('src/main/resources/META-INF/mods.toml').exists() || library.file('src/main/resources/pack.mcmeta').exists())
                throw new GradleException("Library must not declare separate Mod/pack metadata: ${library.path}")
        }
        logger.lifecycle('Ore and Inspector compile independently of GEG sources')
    }
}
tasks.named('verifyOreRelease') { dependsOn tasks.named('verifyOreModules') }
