def testMains = fileTree('src/test/java').matching { include '**/*Test.java' }.files.findAll {
    it.getText('UTF-8') =~ /public static void main\(String\[\] args\)/
}.sort { it.path }

def regressions = testMains.collect { source ->
    def packageName = (source.getText('UTF-8') =~ /package ([\w.]+);/)[0][1]
    tasks.register("regression${source.name - '.java'}", JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "${packageName}.${source.name - '.java'}"
        enableAssertions = true
        workingDir layout.buildDirectory.dir("tmp/regression/${source.name - '.java'}")
        systemProperty 'ore.resourceRoot', rootProject.file('ore/src/main/resources').absolutePath
        systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', layout.buildDirectory.dir('tmp/natives').get().asFile.absolutePath
        systemProperty 'jna.tmpdir', layout.buildDirectory.dir('tmp/jna').get().asFile.absolutePath
        doFirst { workingDir.mkdirs(); new File(workingDir, 'build/tmp').mkdirs() }
        if (source.name == 'ImBlockerCompatibilityTest.java') {
            onlyIf('optional installed IMBlocker jar supplied with -PimBlockerJar') { rootProject.hasProperty('imBlockerJar') }
            if (rootProject.hasProperty('imBlockerJar')) args rootProject.property('imBlockerJar')
        }
        if (source.name == 'CustomSkinLoaderAvatarTest.java' && rootProject.hasProperty('customSkinLoaderJar')) {
            args rootProject.property('customSkinLoaderJar')
        }
    }
}
tasks.register('oreTest') { dependsOn regressions }
tasks.named('check') { dependsOn tasks.named('oreTest') }
