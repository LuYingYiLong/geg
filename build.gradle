plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

ext.oreBuildRoot = file('ore-lib')
apply from: file('ore-lib/gradle/ore-conventions.gradle')
evaluationDependsOn(':ore-lib')

println "Gradle JVM: ${System.getProperty('java.version')} (${System.getProperty('java.vendor')}, ${System.getProperty('os.arch')})"

minecraft {
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // ModularUI's published refmap targets SRG names; this dev run uses official names.
            property 'mixin.env.disableRefMap', 'true'
            args '--mixin.config', 'geg.mixins.json', '--mixin.config', 'ore.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source project(':ore-lib').sourceSets.main
                }
            }
        }

        client {
            ideaModule "${project.name}.main"
            mods { "${mod_id}" {
                source project(':ore-lib').sourceSets.inspector
            } }
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Opt-in business/client fixtures; never mounted by normal client/server runs.
sourceSets {
    clientIntegrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath +
                project(':ore-lib').sourceSets.main.output + project(':ore-lib').sourceSets.inspector.output
    }
}
// IDEA uses the main module; compile Inspector explicitly before its client launcher runs.
// ForgeGradle resolves a run's custom source set classes task in the host project.
tasks.register('inspectorClasses') { dependsOn ':ore-lib:inspectorClasses' }
tasks.matching { it.name == 'prepareRunClientCompile' }.configureEach {
    dependsOn ':ore-lib:inspectorClasses'
}

tasks.register('inspectorTest') { dependsOn ':ore-lib:inspectorTest' }

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    compileOnly project(':ore-lib')
    testImplementation project(':ore-lib')
    clientIntegrationTestCompileOnly project(':ore-lib').sourceSets.inspector.output
    implementation fg.deobf('curse.maven:curios-309927:6418456')
    compileOnly fg.deobf('curse.maven:lightmans-currency-472521:9048567')
    compileOnly fg.deobf('curse.maven:ftb-quests-forge-289412:4872462')
    compileOnly fg.deobf('curse.maven:ftb-teams-forge-404468:4623116')
    compileOnly fg.deobf('curse.maven:ftb-library-forge-404465:4864329')
    compileOnly fg.deobf('curse.maven:architectury-api-419699:5137938')
    if (!project.hasProperty('withoutFtbForTests')) {
        runtimeOnly fg.deobf('curse.maven:ftb-quests-forge-289412:4872462')
        runtimeOnly fg.deobf('curse.maven:ftb-teams-forge-404468:4623116')
        runtimeOnly fg.deobf('curse.maven:ftb-library-forge-404465:4864329')
        runtimeOnly fg.deobf('curse.maven:architectury-api-419699:5137938')
        runtimeOnly fg.deobf('curse.maven:item-filters-309674:4838266')
    }
}

def modMetadata = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties modMetadata

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand modMetadata + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from project(':ore-lib').sourceSets.main.output
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'geg.mixins.json,ore.mixins.json',
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.jar
        }
    }

    repositories {
        maven {
            url = uri("${project.projectDir}/mcmodsrepo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('ore-lib/gradle/ore-tests.gradle')
tasks.named('oreTest') { dependsOn ':ore-lib:oreTest' }

apply from: file('gradle/ore-release-check.gradle')

apply from: file('gradle/ore-portability-check.gradle')
